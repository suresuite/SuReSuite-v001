# AUTHORED — which tables the data contract covers, and why the rest do not yet.
#
# Phase 1 / WP 1.4. `npm run contract:check` requires EVERY table in
# build/schema.introspected.json to be in exactly one of two places:
#
#   · it has a sidecar in supabase/contract/ — then the contract describes every
#     one of its columns, and a page is generated for it; or
#   · it is listed below, with the work package that will author it and why it
#     waits.
#
# A table in neither fails the gate. That is the whole point: a new table added
# to a migration cannot slip into the schema undocumented and unnoticed, which is
# how `approved_users` — the AUTHENTICATION table — came to exist in no migration
# at all for a year (PLAN.md §4, §16 WP 1.4).
#
# Deferring is a commitment, not an excuse. Every entry names a work package that
# already exists in PLAN.md; if a package is renumbered or dropped, this file
# moves with it in the same commit.
#
# AND EVERY DEFERRAL MUST SAY WHETHER THE TABLE IS AUDITED (D54, WP 4.2).
#
# `dataPlaneAudit.test.ts` requires the three `audit_tier_write` triggers on every
# tier-2/3/4 table IN THE CONTRACT. A table deferred here is outside the contract,
# therefore outside that rule, therefore its writes are unattributable WITH
# NOTHING TO NOTICE — and the decision about which tables those are was being made
# by this file, silently, by omission. WP 3.2 hit it from the other side: it
# described three tables and the audit gate went red in the same session, which is
# the gate working and is only possible for a table somebody had already chosen to
# describe.
#
# So each group carries an `audited:` map naming EVERY table in it, and
# `contract:check` R11 fails when a table is missing from it or when the
# declaration disagrees with the triggers the migrations actually create. The
# point is not the boolean. The point is that `false` now has to be TYPED by a
# person, next to the work package that owns fixing it.
#
# §15 measured the six this package owns at zero of six on 2026-09-17; R11 reports
# the number for all of them on every run.

# ── PAGES THAT READ NO PROJECT DATA (WP 5.1) ────────────────────────────────
#
# R12's second half: every page in `src/pages` appears in a `surfaces` entry or
# is named here. A page in neither is a page nobody has decided about — the same
# silence R11 took away from the deferral list above.
#
# "No project data" is precise: each of these reaches tables ONLY through modules
# the app shell mounts everywhere (`useAuth`, `useCapabilities`, the supabase
# client), which `analyse-surfaces.mjs` classifies as `grain: shell` and which do
# not count as lineage. `approved_users` is reachable from thirteen pages that
# way, including a 404 page, and calling that a surface is true about the imports
# and false about the product.
#
# Each entry says WHY, because "reads nothing" is a claim that goes stale the
# moment somebody adds a query.
pages_without_project_data:
  - About.tsx                # static marketing copy; no query of any kind
  - Auth.tsx                 # sign-in; reaches approved_users only through useAuth
  - DemoEntry.tsx            # /demo front door; sets a sessionStorage flag (demoSession.ts)
                             # and reloads onto a demo page. Reads approved_users only
                             # through useAuth; the demo PAGES it opens are covered
                             # by their own surfaces entries
  - AuthForgotPassword.tsx   # /auth's "Forgot password?" form; one RPC, request_password_reset,
                             # which records a note for a super admin and reads no project data
  - Forbidden.tsx            # 403 interstitial; renders a message and a link
  - GettingStarted.tsx       # static onboarding copy
  - Landing.tsx              # unauthenticated landing page
  - NotFound.tsx             # 404 interstitial
  - OrbitMrpCallback.tsx     # OAuth callback; posts a code to an edge function
                             # and redirects. It touches `project_erp_links`
                             # through `erp-sync-orbit-mrp`, which is an EDGE
                             # FUNCTION — a hop the static analyser cannot follow
                             # and deliberately does not guess at (see §16).

deferred:
  - wp: "5.2"
    why: >-
      Outside the data spine. These are the AI and public-API control planes:
      they carry no simulation input, no engine-read field and no user-uploaded
      value, so a data-contract sidecar would describe machinery rather than the
      user's data. PLAN.md §6.3 documents them in the manual's sections 14 and
      15 instead, and lists several of them explicitly as internal-only. If one
      ever starts carrying a value a simulation reads, it moves into the contract
      — that is the test, not the table's age.
    tables:
      - ai_budgets
      - ai_chat_events
      - ai_model_capabilities
      - ai_models
      - ai_providers
      - ai_usage_logs
      - api_idempotency
      - api_keys
      - api_rate_limits
      - api_request_logs
      - chat_folders
      - chat_messages
      - chat_plans
      - chat_threads
      - project_memory
      - proposals
      - user_files
    audited:
      ai_budgets: false
      ai_chat_events: false
      ai_model_capabilities: false
      ai_models: false
      ai_providers: false
      ai_usage_logs: false
      api_idempotency: false
      api_keys: false
      api_rate_limits: false
      api_request_logs: false
      chat_folders: false
      chat_messages: false
      chat_plans: false
      chat_threads: false
      project_memory: false
      proposals: false
      user_files: false

# ── EDGE FUNCTIONS: DEPLOYED, OR DEFERRED WITH A REASON ─────────────────────
#
# §4 D123: twelve of eighteen edge functions were absent from
# `.github/workflows/supabase-functions.yml`, so their code shipped to `main`, went
# green in CI, and never reached production. Slice 15 added the four analyzers and
# SIZED the gate without writing it: "Nothing compares the functions the repo holds
# against the functions the workflow names. That check is the real fix — the same
# shape as `table-covered`, where a table is either described or deferred to a named
# package — and it would have caught this on the day WP 4.3 merged."
#
# This is that register, and `contract:check` R17 is that check. A function in
# `supabase/functions/` must either be deployed by the workflow or listed here with
# an owner and a reason. There is no third option, which is exactly what
# `table-covered` (R1) took away from tables.
#
# WHY THESE SIX ARE NOT SIMPLY ADDED. Slice 15's argument holds: each has been
# running an unknown build for an unknown time, and pushing one sight-unseen is a
# production change whose blast radius nobody has measured. `ingest-file` was added
# in WP 6.3 on the opposite argument — a shipped package depends on it and its source
# is CI-green — and that argument does not extend to these.
#
# `ingest-file` LEFT THIS LIST IN WP 6.5 (a), in the same commit that added its deploy
# step and push path — R17 accepts either state and refuses neither-nor, so the two
# edits cannot travel apart. Its deferral was never about its source; it was that
# publishing it switches every upload in production at once, and that needed a §15
# reading either side of the merge (§16 · WP 6.5a).
#
# `delete-project` LEFT IT under §4 D170. Its deferral said "destructive and undiffed";
# §15 then diffed it the only way available — by reading production's copy fail. Every
# deletion died on a dropped table after removing rows. The published build deletes
# nothing by hand: it calls `public.delete_project`, one transaction.
functions_not_deployed:
  - fn: erp-sync-orbit-mrp
    wp: "7.1"
    why: >-
      WP 4.1 found it promoting `ingest_staged_products` to `products` WITHOUT
      `ingest_apply_run` — per row, with no actor and no role — and closed that in
      the database. Whether production's deployed copy is the one WP 4.1 read is
      unknown, so a deploy could either fix the path or replace a working connector
      with an untested one. Diffing it against production is the prerequisite.
  - fn: get-mapbox-token
    wp: "7.1"
    why: >-
      Hands out a token. It is the smallest of the six and the one whose blast
      radius is a credential, so it belongs with the package that owns the grant
      surface rather than with a data-layer slice.
  - fn: ingest-bom-multi-level
    wp: "7.1"
    why: >-
      One of the three legacy `ingest-*` functions WP 4.1 routed through
      `ingest_legacy_upsert_lane`, whose target list is a whitelist in a migration.
      The DATABASE half is closed and gated; whether the deployed function calls the
      lane or still holds a PostgREST client is exactly what has not been checked.
  - fn: ingest-inbound-logistics
    wp: "7.1"
    why: >-
      See `ingest-bom-multi-level` — the same three-function group, the same
      unanswered question about which build production is running.
  - fn: ingest-outbound-logistics
    wp: "7.1"
    why: >-
      See `ingest-bom-multi-level` — the same three-function group, the same
      unanswered question about which build production is running.
