name: Demo seed (data, policies, scenarios, runs)

# Loads the demo projects and gives /policies and the Simulation Lab something to show.
#
#   large-data  builds scripts/demo_project_large (500 suppliers) and loads it into a project
#               owned by the old large demo's owner: masters by RPC, then the BOM and lanes as ONE
#               SQL transaction (LANES_VIA=sql, the README's route), then the rest and the
#               network analyses (LANES_VIA=loaded).
#   runs        per demo: saves the customer terms, two policy versions, three scenarios and
#               their six runs through the public API (scripts/seed_demo_runs.mjs).
#   readiness   the read-only report, published to `demo-readiness-results`.
#
# Secret: SUPABASE_ACCESS_TOKEN only (already used by the seed and nexus workflows). Each demo
# is written AS ITS OWNER through the app's own path — the owner is the project's modeler,
# read from the database (scripts/demo/owner.py); the new large project takes the owner of
# the 1 000-supplier project it replaces.
#
# TRIGGER: push `.github/demo-seed-request` with key=value lines:
#   demos=small,large          which demos get policies, scenarios and runs
#   large_data=1               also (re)load the large demo's data first
#   replications=10

on:
  push:
    paths:
      - ".github/demo-seed-request"

concurrency:
  group: demo-seed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  params:
    runs-on: ubuntu-latest
    outputs:
      demos: ${{ steps.p.outputs.demos }}
      large_data: ${{ steps.p.outputs.large_data }}
      replications: ${{ steps.p.outputs.replications }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          get() { grep -oP "^$1=\K.+" .github/demo-seed-request | tail -1 || true; }
          echo "demos=$(get demos)" >> "$GITHUB_OUTPUT"
          echo "large_data=$(get large_data)" >> "$GITHUB_OUTPUT"
          r=$(get replications); echo "replications=${r:-10}" >> "$GITHUB_OUTPUT"

  large-data:
    needs: params
    if: needs.params.outputs.large_data == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DATASET_DIR: scripts/demo_project_large/out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the large dataset
        run: python scripts/demo_project_large/build_dataset.py
      - name: Resolve the owner
        run: |
          python scripts/demo/owner.py "Demo — Large Network (100 products, 500 suppliers)" \
            "Demo — Large Network (100 products, 1 000 suppliers)" >> "$GITHUB_ENV"
      - name: 1 · project and item masters (writes load_lanes.sql)
        run: LANES_VIA=sql SKIP_ANALYSES=1 BATCH_ROWS=1000 node scripts/seed_demo_project.mjs
      - name: 2 · BOM and lanes, one transaction
        run: python scripts/demo/run_sql_file.py "$DATASET_DIR/load_lanes.sql"
      - name: 3 · locations, firm graph, analyses, read-back
        run: LANES_VIA=loaded BATCH_ROWS=300 node scripts/seed_demo_project.mjs

  runs:
    needs: [params, large-data]
    if: ${{ always() && needs.params.result == 'success' && needs.large-data.result != 'failure' && needs.params.outputs.demos != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        demo: [small, large]
    steps:
      - uses: actions/checkout@v4
      - name: Is this demo requested?
        id: want
        run: |
          case ",${{ needs.params.outputs.demos }}," in *",${{ matrix.demo }},"*) echo "yes=1" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/setup-node@v4
        if: steps.want.outputs.yes == '1'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: steps.want.outputs.yes == '1'
        with:
          python-version: "3.12"
      - name: Build the large dataset
        if: steps.want.outputs.yes == '1' && matrix.demo == 'large'
        run: python scripts/demo_project_large/build_dataset.py
      - name: Resolve the owner
        if: steps.want.outputs.yes == '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ matrix.demo }}" = small ]; then
            python scripts/demo/owner.py "Demo — Control Unit Supply Network" >> "$GITHUB_ENV"
          else
            python scripts/demo/owner.py "Demo — Large Network (100 products, 500 suppliers)" >> "$GITHUB_ENV"
          fi
      - name: Policies, scenarios and runs (as the owner, through the app's path)
        if: steps.want.outputs.yes == '1'
        env:
          DEMO: ${{ matrix.demo }}
          REPLICATIONS: ${{ needs.params.outputs.replications }}
        run: node scripts/seed_demo_runs.mjs

  readiness:
    needs: [runs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read both demo projects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/demo/demo_readiness.py Demo
      - name: Publish to the demo-readiness-results branch
        run: |
          mkdir -p /tmp/pubfiles && cp -r demo-readiness.md demo-readiness.json /tmp/pubfiles/ && { [ -d snapshots ] && cp -r snapshots /tmp/pubfiles/ || true; }
          git worktree add --detach pub
          cd pub && git checkout -q --orphan demo-readiness-results-new && git rm -rfq . || true
          cp -r /tmp/pubfiles/* . && git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -q -m "demo readiness after seed (run ${{ github.run_id }})"
          git push -f origin HEAD:demo-readiness-results
