name: Nexus stress battery

# PLAN.md §27 WP 17.4 · §4 D310 — prepare the Nexus card's results in advance.
#
# Every supplier and every supplied material of ONE project is disrupted alone
# under the shared scenario (`scsim.stress.nexus.NEXUS_SCENARIO`), on the
# project's ACTIVE Validated Model, and the lost sales are published to the
# database (`analysis_publish_nexus_stress`), where the Nexus card reads them.
# Nothing runs on page view.
#
#   prepare  reads the baseline, runs the clean reference, opens the battery,
#            sizes the shards, uploads ONE bundle (the only job besides publish
#            that holds the database secret)
#   cells    one job per shard; no secret, no database; proves its clean
#            reference is the bundle's, runs its targets, uploads its rows
#   publish  merges every shard (each target exactly once) and publishes the
#            battery whole — or marks the run failed, so its key is free again
#
# GitHub's limits, and what each decided (§27 WP 17.4's table): a job may run 6 h
# and a shard is sized for ~45 min (timeout 120); a matrix holds 256 jobs and the
# plan caps concurrency, so there are at most 20 shards; a standard runner has
# 7 GB and a shard keeps KPI traces only; minutes are billed, so nothing runs on
# a schedule, and a failed shard marks the run failed (its key freed) so a retry
# is a new request rather than a stuck run;
# artifacts are transport (7 days), the database is the record; the engine is the
# committed wheels, so a runner image change cannot move a figure.
#
# TRIGGER: push `.github/nexus-stress-request` (key=value lines: project_name=,
# optional model_code= (e.g. 2026Q4-4) or model_validation_id=, dataset_version_id=,
# replications=, seed=, start_week=, durations= (e.g. 5, 2,4 or 2-9), actor_email=)
# — works from any branch — or run it by hand (default branch). Blank start_week
# and durations mean the shared scenario (week 26, 2–9 weeks).
# The writer exists in production only after migration `20261021000001` deploys.
#
# A LARGE PROJECT (2 300 targets: 500 suppliers + 1 800 materials ≈ 4 s per cell on the demo
# dataset, ~21 CPU-hours): add `shards=`, `max_parallel=` and `keep_on_failure=1` to the
# request. `shards=12 max_parallel=4` runs twelve ~1.7 h jobs, four at a time (about three
# waves, a working day end to end), inside GitHub's 6 h job limit, and with
# `keep_on_failure=1` one failed shard does NOT mark the battery failed: the run stays
# claimed and "Re-run failed jobs" repeats only the missing shards (their artifacts last
# 7 days), then publishes whole. Without the keys nothing changes: up to 20 shards of ~45
# min, 20 at a time, and a failed shard frees the key.

on:
  push:
    paths:
      - ".github/nexus-stress-request"
  workflow_dispatch:
    inputs:
      project_name:
        description: "The project's exact name, e.g. Project AA - ver3"
        required: true
      model_validation_id:
        description: "Validated Model id (blank = the project's active model)"
        default: ""
      model_code:
        description: "Validated Model code, e.g. 2026Q4-4 (instead of the id)"
        default: ""
      seed:
        description: "Root seed (blank = the model protocol's)"
        default: ""
      start_week:
        description: "Outage start week (blank = 26)"
        default: ""
      durations:
        description: "Outage durations in weeks: 5, 2,4 or 2-9 (blank = 2-9)"
        default: ""
      dataset_version_id:
        description: "Data version id (blank = the model's own)"
        default: ""
      replications:
        description: "Replications per cell"
        default: "10"
      actor_email:
        description: "Approved user the battery is attributed to (blank = the project's modeler)"
        default: ""
      shards:
        description: "Number of shard jobs (blank = sized for ~45 min each, at most 20)"
        default: ""
      max_parallel:
        description: "Shard jobs running at once (blank = 20)"
        default: ""
      keep_on_failure:
        description: "1 = a failed shard leaves the battery claimed so 'Re-run failed jobs' can finish it"
        default: ""

concurrency:
  group: nexus-stress
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.prepare.outputs.shards }}
      skip: ${{ steps.prepare.outputs.skip }}
      max_parallel: ${{ steps.params.outputs.max_parallel }}
      keep: ${{ steps.params.outputs.keep }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the committed engine build
        run: pip install public/engine/*.whl
      - name: Resolve parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            get() { grep -oP "^$1=\K.+" .github/nexus-stress-request | tail -1 || true; }
            echo "project_name=$(get project_name)" >> "$GITHUB_OUTPUT"
            echo "model_validation_id=$(get model_validation_id)" >> "$GITHUB_OUTPUT"
            echo "model_code=$(get model_code)" >> "$GITHUB_OUTPUT"
            echo "seed=$(get seed)" >> "$GITHUB_OUTPUT"
            echo "start_week=$(get start_week)" >> "$GITHUB_OUTPUT"
            echo "durations=$(get durations)" >> "$GITHUB_OUTPUT"
            echo "dataset_version_id=$(get dataset_version_id)" >> "$GITHUB_OUTPUT"
            echo "replications=$(get replications)" >> "$GITHUB_OUTPUT"
            echo "actor_email=$(get actor_email)" >> "$GITHUB_OUTPUT"
            echo "shards=$(get shards)" >> "$GITHUB_OUTPUT"
            mp=$(get max_parallel); echo "max_parallel=${mp:-20}" >> "$GITHUB_OUTPUT"
            [ "$(get keep_on_failure)" = 1 ] && echo "keep=true" >> "$GITHUB_OUTPUT" || echo "keep=false" >> "$GITHUB_OUTPUT"
          else
            echo "project_name=${{ inputs.project_name }}" >> "$GITHUB_OUTPUT"
            echo "model_validation_id=${{ inputs.model_validation_id }}" >> "$GITHUB_OUTPUT"
            echo "model_code=${{ inputs.model_code }}" >> "$GITHUB_OUTPUT"
            echo "seed=${{ inputs.seed }}" >> "$GITHUB_OUTPUT"
            echo "start_week=${{ inputs.start_week }}" >> "$GITHUB_OUTPUT"
            echo "durations=${{ inputs.durations }}" >> "$GITHUB_OUTPUT"
            echo "dataset_version_id=${{ inputs.dataset_version_id }}" >> "$GITHUB_OUTPUT"
            echo "replications=${{ inputs.replications }}" >> "$GITHUB_OUTPUT"
            echo "actor_email=${{ inputs.actor_email }}" >> "$GITHUB_OUTPUT"
            echo "shards=${{ inputs.shards }}" >> "$GITHUB_OUTPUT"
            mp="${{ inputs.max_parallel }}"; echo "max_parallel=${mp:-20}" >> "$GITHUB_OUTPUT"
            [ "${{ inputs.keep_on_failure }}" = 1 ] && echo "keep=true" >> "$GITHUB_OUTPUT" || echo "keep=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare the battery
        id: prepare
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_NAME: ${{ steps.params.outputs.project_name }}
          MODEL_ID: ${{ steps.params.outputs.model_validation_id }}
          MODEL_CODE: ${{ steps.params.outputs.model_code }}
          SEED: ${{ steps.params.outputs.seed }}
          START_WEEK: ${{ steps.params.outputs.start_week }}
          DURATIONS: ${{ steps.params.outputs.durations }}
          DATASET_ID: ${{ steps.params.outputs.dataset_version_id }}
          REPS: ${{ steps.params.outputs.replications }}
          ACTOR_EMAIL: ${{ steps.params.outputs.actor_email }}
          SHARDS: ${{ steps.params.outputs.shards }}
        run: |
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::no project_name — add 'project_name=<exact name>' to .github/nexus-stress-request"; exit 1
          fi
          ARGS=(--project-name "$PROJECT_NAME" --replications "${REPS:-10}" --out bundle.json)
          [ -n "$MODEL_ID" ] && ARGS+=(--model-id "$MODEL_ID")
          [ -n "$MODEL_CODE" ] && ARGS+=(--model-code "$MODEL_CODE")
          [ -n "$SEED" ] && ARGS+=(--seed "$SEED")
          [ -n "$START_WEEK" ] && ARGS+=(--start-week "$START_WEEK")
          [ -n "$DURATIONS" ] && ARGS+=(--durations "$DURATIONS")
          [ -n "$DATASET_ID" ] && ARGS+=(--dataset-version-id "$DATASET_ID")
          [ -n "$ACTOR_EMAIL" ] && ARGS+=(--actor-email "$ACTOR_EMAIL")
          [ -n "$SHARDS" ] && ARGS+=(--shards "$SHARDS")
          python scripts/nexus/nexus_job.py prepare "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-bundle
          path: bundle.json
          retention-days: 7

  cells:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345          # GitHub's limit is 360; a shard is sized well under it
    strategy:
      fail-fast: ${{ needs.prepare.outputs.keep != 'true' }}
      max-parallel: ${{ fromJson(needs.prepare.outputs.max_parallel) }}
      matrix:
        index: ${{ fromJson(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the committed engine build
        run: pip install public/engine/*.whl
      - uses: actions/download-artifact@v4
        with:
          name: nexus-bundle
      - name: Run shard ${{ matrix.index }}
        run: python scripts/nexus/nexus_job.py shard --bundle bundle.json --index ${{ matrix.index }} --out shard-${{ matrix.index }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-shard-${{ matrix.index }}
          path: shard-${{ matrix.index }}.json
          retention-days: 7

  publish:
    needs: [prepare, cells]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the committed engine build
        run: pip install public/engine/*.whl
      - uses: actions/download-artifact@v4
        with:
          name: nexus-bundle
      - uses: actions/download-artifact@v4
        if: needs.cells.result == 'success'
        with:
          pattern: nexus-shard-*
          path: rows
      - name: Publish the battery
        if: needs.cells.result == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/nexus/nexus_job.py publish --bundle bundle.json --rows-dir rows --summary-md "$GITHUB_STEP_SUMMARY"
      - name: A shard failed — the battery stays claimed
        if: needs.cells.result != 'success' && needs.prepare.outputs.keep == 'true'
        run: |
          echo "::error::A shard job failed. The battery is still claimed. Open this run and choose 'Re-run failed jobs': only the failed shards repeat, then this job publishes whole. To abandon it instead, the run must be marked failed in the database (analysis_fail_run) so its key is free."
          exit 1
      - name: Mark the run failed (its key is free for a retry)
        if: (needs.cells.result != 'success' && needs.prepare.outputs.keep != 'true') || (failure() && needs.cells.result == 'success')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CELLS_RESULT: ${{ needs.cells.result }}
        run: python scripts/nexus/nexus_job.py fail --bundle bundle.json --reason "shard jobs ended $CELLS_RESULT"
