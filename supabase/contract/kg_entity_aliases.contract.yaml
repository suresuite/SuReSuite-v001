# AUTHORED — the data contract's sidecar for `kg_entity_aliases`.
# Phase 19 / WP 19.1 (docs/PLAN.md §29). Edit this file; docs/data/tables/*.md is generated from it.
table: kg_entity_aliases
tier: "3"
schema_name: public
grain: >-
  One other name an entity of an organization's knowledge graph goes by, with the source that used
  it.
owner: platform

natural_key_unique:
  - source: PRIMARY KEY constraint
    columns: [id]
    name: kg_entity_aliases_pkey
  - source: UNIQUE index
    columns: [organization_id, entity_id, normalized]
    name: kg_entity_aliases_natural_key

natural_key_intended: [organization_id, entity_id, normalized]

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    Per organization, and unlike external_evidence (readable by everyone) no API role may SELECT
    it: RLS is on with no policy and no grant. Reads go through kg_list_entities, writes through
    kg_upsert_entity and kg_queue_identity_review, each SECURITY DEFINER and each refusing an
    actor outside the organization (insufficient_privilege) or no actor at all — the organization
    check is kg_assert_org_member, and a super admin may read any graph. Audited at tier 3 by the
    three statement-grain triggers (rehearsal/960 proves the row names the actor). Outside the
    simulation: no engine input and no graph-hash scope reads it (PLAN.md §29 rule 4).

