    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The registered engine the run was dispatched to (`sim_engines`). Dispatch refuses a
      retired engine and defaults to the single active one; the worker refuses a run bound
      to an engine it does not run. Backfilled for history from `code_version`, and
      derived the same way for a writer that does not state it.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  run_spec:
    type: "jsonb"
    unit: null
    unit_source: none
    meaning: >-
      Everything the RunKey hashes, as data: the engine (id, slug, version, code_version
      as registered at dispatch), `policy_hash`, the graph term, the scenario row minus
      its identity and presentation columns, and `protocol_overrides`. Every binding of the
      run resolves from here with no live read. NULL for runs dispatched before WP 10.4.
      `run_key_version` says which graph term: 1 is `graph_hash` (the composite), 2 —
      every run since WP 11.2 — is `simulation_hash`, the scope the engine reads. A spec is
      never rewritten, so a v1 key never equals a v2 key.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  run_key:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      sha256 of `run_spec` — the run's identity. Identical submissions share it:
      `create_simulation_run` offers a completed run with this key for reuse and attaches
      a second submission to one in flight. NULL before WP 10.4.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  protocol_overrides:
    type: "jsonb"
    unit: null
    unit_source: none
    meaning: >-
      Deviations from the Validated Model's protocol, as the caller stated them; `{}` =
      faithful. Part of the RunKey, and shown on results and exports (T2, T4).
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  exploratory:
    type: "boolean"
    unit: null
    unit_source: none
    meaning: >-
      The run followed no Validated Model, or was dispatched explicitly as exploratory.
      Never false for a run with no model. Badged everywhere and excluded from surrogate
      training (WP 10.5, 10.8). Backfilled as `model_validation_id IS NULL`.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  series_object:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The run's weekly series object in the private `run-results` bucket,
      `<project_id>/<run_id>/series.parquet` — zstd Parquet, long form (one row per
      replication and week, one column per series). When set, the replication rows hold
      `time_series = {}` and `runSeries.ts` hydrates them through a signed URL `sim-
      command` mints. NULL for a run whose series are in its rows (before WP 10.6,
      browser-computed runs, or a failed upload — the worker keeps the JSONB rather than
      lose it) and for a run whose series expired.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
