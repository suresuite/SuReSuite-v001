    surfaces: []
    resolution: null
  hash_simulation:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The simulation scope's hash — the `inputs` domain of the run's snapshot, what the
      engine read (WP 11.2, §4 D260). RunKey v2 hashes it, so a deep-tier upload no run
      reads does not make an identical simulation a new key. Read by
      `create_simulation_run` off the snapshot row itself; history learnt it from its own
      snapshot. NULL where the run has no snapshot that carries one.
    grain: metadata
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  simulation_version_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The simulation scope's level version the run computed over ("simulation inputs v4",
      `graph_level_versions`). NULL exactly where `hash_simulation` names no version.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
