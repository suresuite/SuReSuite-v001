# AUTHORED — the data contract's sidecar for `kg_entities`.
# Phase 19 / WP 19.1 (docs/PLAN.md §29). Edit this file; docs/data/tables/*.md is generated from it.
table: kg_entities
tier: "3"
schema_name: public
grain: >-
  One real firm, facility, product, material or location an organization's knowledge graph has
  evidence about — one identity, however many names the evidence uses for it (Phase 19,
  docs/PLAN.md §29).
owner: platform

natural_key_unique:
  - source: PRIMARY KEY constraint
    columns: [id]
    name: kg_entities_pkey
  - source: UNIQUE index
    columns: [organization_id, kg_key]
    name: kg_entities_natural_key

natural_key_intended: [organization_id, kg_key]

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    Per organization, and unlike external_evidence (readable by everyone) no API role may SELECT
    it: RLS is on with no policy and no grant. Reads go through kg_list_entities, writes through
    kg_upsert_entity and kg_queue_identity_review, each SECURITY DEFINER and each refusing an
    actor outside the organization (insufficient_privilege) or no actor at all — the organization
    check is kg_assert_org_member, and a super admin may read any graph. Audited at tier 3 by the
    three statement-grain triggers (rehearsal/960 proves the row names the actor). Outside the
    simulation: no engine input and no graph-hash scope reads it (PLAN.md §29 rule 4).

surfaces: []

fields:
  id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      Surrogate key; the natural key is (organization_id, kg_key).
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  organization_id:
    type: "uuid"
    unit: null
    unit_source: none
    meaning: >-
      The organization whose graph this is. Every read and write checks the caller belongs to it
      (owner decision 2026-11-07: per organization).
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  entity_type:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      Company · Facility · Product · Material · Location (CHECK-constrained).
    grain: level
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
    note: >-
      Not an engine input: the knowledge graph stays outside the simulation until a fact is
      applied into the project's own tables (docs/PLAN.md §29 rule 4).
  kg_key:
    type: "text"
    unit: null
    unit_source: none
    meaning: >-
      The strongest identifier as one string (lei:, rmi:, wd:, osh:, ema:, or
      name:<normalized>|<country>), computed once by the resolver in
      supabase/functions/_shared/kgResolver.ts and never re-derived here.
    grain: identifier
    engine: {consumed_by: null, transform: null, missing_default: null}
    substitutions: []
    ingest: {csv_header: null, required: false, validate: null}
    surfaces: []
    resolution: null
  name:
