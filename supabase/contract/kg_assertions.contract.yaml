# AUTHORED — the data contract's sidecar for `kg_assertions`.
# Phase 19 / WP 19.2 (docs/PLAN.md §29). Edit this file; docs/data/tables/*.md is generated from it.
table: kg_assertions
tier: "3"
schema_name: public
grain: >-
  One fact between two entities of an organization's knowledge graph — subject, relation, object
  and what distinguishes it (a tier, a role, a product) — with the dates it holds and when it was
  first and last seen. Its status is computed from its evidence, never stored (docs/PLAN.md §29,
  WP 19.2).
owner: platform

natural_key_unique:
  - source: PRIMARY KEY constraint
    columns: [id]
    name: kg_assertions_pkey
  - source: UNIQUE index
    columns: [organization_id, subject_id, relation, object_id, qualifier_key]
    name: kg_assertions_natural_key

natural_key_intended: [organization_id, subject_id, relation, object_id, qualifier_key]

governance:
  read: null
  write: null
  min_project_role: viewer
  audited: true
  rls_enabled: true
  note: >-
    Per organization: RLS on with no policy and no grant to an API role. Facts are written by
    kg_record_assertion (which refuses entities or evidence from another organization) and read by
    kg_list_assertions, both refusing an actor outside the organization through
    kg_assert_org_member. Status (verified / corroborated / provisional / stale / contradicted) is
    computed by kg_assertion_status from distinct publisher groups, never stored. Audited at tier
    3; rehearsal/970 proves independence, staleness, contradiction, the natural key and isolation.
    Outside the simulation (PLAN.md §29 rule 4).

surfaces: []

