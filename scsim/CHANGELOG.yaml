# The scsim engine's change record — PLAN.md §25 (Phase 15) · WP 15.4 · gate `engine-ledger`.
#
# ONE ENTRY PER ENGINE VERSION, NEWEST FIRST. This file is the only place an
# engine version's meaning is authored. Generated from it, never by hand:
#   scsim/docs/changelog.md                          (scripts/gen_changelog.py)
#   src/components/docs/generated/engineChangelog.generated.ts  (same script)
#
# Fields, per entry:
#   version        ENGINE_VERSION this entry describes (semantic).
#   date           the day the version was set.
#   commit         the commit that set it (null for the entry a branch is adding:
#                  the commit does not exist until it is made; CI fills nothing in).
#   tier           change-governance tier (Part IX §9.5): 1 no behaviour change ·
#                  2 new variable / behaviour-neutral default, or a correction → patch ·
#                  3 new phase or contract change → minor or major, with an ADR.
#   adr            the ADR a Tier 3 entry rests on (required for tier 3).
#   summary        plain words, for a user of the platform.
#   technical      for an engineer: what moved, where.
#   policies       catalog IDs the change touches (P-S.x, P-P.x, P-T.x, P-C.x, P-F.x, P-X.x).
#   kpis           registry KPI names whose values can move.
#   goldens_moved  frozen reference runs whose digest moved, as `engine:<name>`
#                  (scsim/tests/data/golden_digests.json) or `worker:<case>`
#                  (sim-worker/tests/data/golden_runs.json). null = the version
#                  predates the frozen digests (WP 14.0), so nothing can be said.
#   comparable     identical · changed-for · not-comparable — whether a result of the
#                  previous version can be compared with one of this version.
#   comparability  one sentence: for whom results change, and how.
#   refs           D-numbers, work packages, ADRs.
#   amendments     engine-source changes made under this version WITHOUT a bump,
#                  appended (never edited) — each with date, commit, tier, summary.
#   backfilled     true for entries written by WP 15.4 from git history; their
#                  `unrecorded_changes` counts engine-source commits made under the
#                  version that no record describes. A backfilled entry says what
#                  is known and does not invent the rest.
#
# THE GATE (scsim/scripts/check_changelog.py, run in scsim-tests.yml):
#   1 ENGINE_VERSION has exactly one entry; versions unique and descending.
#   2 a moved golden digest ⇒ ENGINE_VERSION differs from the base, and the new
#     entry's goldens_moved lists exactly the moved runs.
#   3 a changed pipeline_schema.json ⇒ the new entry is tier 3 with an ADR.
#   4 `comparable: identical` only when no golden moved.
#   6 engine source changed with no bump ⇒ the current entry gained an amendment.
#   7 append-only: an entry on the base branch is unchanged here, except for
#     amendments appended to it.
#   8 the record does not understate its measured effect: against
#     docs/releases/<version>.json (release_report.py, WP 15.5), `identical` only
#     when no KPI changed on the reference set, and a `changed-for` entry names
#     every KPI that moved beyond noise.

- version: "0.9.0"
  date: 2026-11-04
  commit: null
  tier: 2
  adr: null
  summary: >-
    A scenario can now disrupt a material, not only a supplier or the plant. A material outage
    stops every supply of that one material for its weeks, while the suppliers that ship it keep
    shipping their other materials. Before this version such an event was skipped with a warning
    and the run went ahead undisrupted. A material is disrupted as a full outage only: a smaller
    percentage on a material runs as the full outage and the run's notes say so, because the
    engine cuts capacity per supplier, not per material.
  technical: >-
    `project_map._map_events` takes `mat_ids` (the materials with a supply link, from the call
    site) and maps `material:<id>` to `DisruptionEvent(target_type=NODE_MATERIAL)` with the same
    start/duration rounding and clamps as a supplier event; magnitude < 100 earns a `magnitude`
    warning and still maps as `lead_time_extension`; an unknown or unsupplied material is skipped
    with its own `target` warning. `material` leaves `UNSUPPORTED_EVENT_KINDS`.
    `registry_export.disruption_rule()` exports `supported_target_kinds` with `material` and
    `material_cut_runs_as_outage: true`. The engine-side event (WP 17.1) is unchanged.
  policies: []
  kpis: [fill_rate, lost_sales_value, lost_inbound_units, max_backlog, ttr_weeks, tts_weeks, service_loss_area, cost_of_resilience]
  goldens_moved: []
  comparable: changed-for
  comparability: >-
    Results change only for a scenario whose disruption schedule names a supplied material
    (`material:<id>`), which used to run undisrupted; every other scenario runs exactly as before
    (no frozen reference run has a material event).
  refs: [D311, D112, WP 19.1]
  amendments: []

- version: "0.8.3"
  date: 2026-10-27
  commit: null
  tier: 2
  adr: null
  summary: >-
    Safety stock is now a real recovery strategy. For the materials a disrupted supplier ships,
    a scenario can hold extra days of cover between a start week and an end week: the reorder
    levels rise only in those weeks, so the buffer is built from orders placed at the start and
    arrives a lead time later, and its holding cost is charged at the material's own holding
    rate for those weeks only. The /policies safety stock is unchanged, and a scenario that sets
    no buffer runs exactly as before.
  technical: >-
    P-P.3 `windows` (`SafetyStockWindow`: material_id, days, start_week, end_week exclusive):
    E[D_m]·days/7 added to s and S at PH-70 while active (never to a stated level); holding
    h_m·c_m·units booked in `ss_holding` for active weeks. The mapper maps
    `recovery.safety_stock_windows` under the `safety_stock_drawdown` response (and only while
    recovery is enabled), skips a malformed window with its reason, and warns for a material the
    project does not simulate, for an MRP inventory policy (which reads no reorder levels), and
    for Safety stock ticked with no window. `engineBridge.json` maps the response to
    `safety_stock_materials`; the pre-run grader honours `enabled: false`.
  policies: [P-P.3]
  kpis: []
  goldens_moved: []
  comparable: changed-for
  comparability: >-
    Results change only for a scenario that ticks Safety stock and sets a buffer window; every
    other scenario runs exactly as before (every frozen reference run kept its digest).
  refs: [D315]
  amendments: []

- version: "0.8.2"
  date: 2026-10-27
  commit: null
  tier: 2
  adr: null
  summary: >-
    A scenario's recovery playbook now runs as it reads. "Recovery enabled" off switches every
    recovery strategy off (it was never read, so ticked strategies ran anyway). Each strategy's
    cost or horizon field reaches its policy instead of being ignored, and the backup lead time
    can be left blank to mean each backup supplier's own. A backup supplier can be entered on a
    scenario for a material no uploaded supplier backs up: it is used only while the primary is
    disrupted and is never made the primary. A strategy the engine does not model is named in the
    run's notes instead of being silently dropped.
  technical: >-
    `recovery_responses()` gates `_map_policies` on `recovery.enabled`. `backup_lead_time_weeks`
    → P-S.1 `backup_lead_time_weeks` (blank = the link's own), `overtime_cost_pct` → P-P.5
    `overtime_premium_pct_of_price`, `expedite_cost_pct` → P-T.2 `premium_pct_of_cost`,
    `allocation_horizon_weeks` / `annual_labor_cost` → P-P.9 `window_weeks` / `annual_cost`.
    `SupplierLink.backup_only` (default false): `primary_rank` ranks it after every uploaded
    link, `CompiledModel.link_backup_only` excludes it from P-S.2's planned shares, and
    `_scenario_backup_links` adds one per `recovery.backup_lanes` entry only while
    `dual_source_activate` is on, with a `Supplier` for an id no uploaded lane names. A
    `safety_stock_drawdown` or `demand_shaping` response earns a mapping warning.
  policies: [P-S.1, P-S.2, P-P.5, P-P.9, P-T.2]
  kpis: []
  goldens_moved: []
  comparable: changed-for
  comparability: >-
    Results change only for a scenario whose playbook switches recovery off while ticking
    strategies, states a strategy cost or horizon, or enters a backup supplier; every other
    scenario runs exactly as before (every frozen reference run kept its digest).
  refs: [D114, D315]
  amendments: []

- version: "0.8.1"
  date: 2026-10-21
  commit: null
  tier: 2
  adr: null
  summary: >-
    A single material can now be disrupted: every supplier's deliveries of that material stop
    for the outage, and nothing else those suppliers ship is affected. Backup-supplier,
    multi-sourcing, expediting and material-allocation policies see the outage per material, so
    a supplier's healthy materials are never treated as disrupted. Every existing scenario runs
    exactly as before.
  technical: >-
    `TargetType.NODE_MATERIAL` (lead_time_extension only; a capacity cut stays per supplier).
    `ResolvedEvent.material_idx`; `SimContext.link_lt_block_end` (per link) composed with the
    per-supplier block by the later end in the week_start mechanic, the arrival deferral and the
    quoted arrival. `SimContext.visible_disrupted_links()` is read by P-S.1, P-S.2, P-T.2 and
    P-P.9 in place of the supplier mask indexed by link. The project mapper and the platform's
    dispatch gate are unchanged: a `material:*` schedule entry is still skipped there (§4 D112).
  policies: [P-S.1, P-S.2, P-T.2, P-P.9]
  kpis: []
  goldens_moved: []
  comparable: identical
  comparability: >-
    No existing scenario can carry a material event, so every result is unchanged (every frozen
    reference run kept its digest); material outages are new.
  refs: [D311, WP 17.1]
  amendments:
    - date: 2026-10-21
      commit: null
      tier: 2
      summary: >-
        The nexus battery (`scsim.stress.nexus`, PLAN.md §27 WP 17.2): every supplier and
        every supplied material disrupted alone under one shared scenario — a full outage from
        week 26, or the first week after warm-up if later, for each of 2–9 weeks — with the
        lost sales in € paired against the undisrupted run, ranked by the average over the
        eight durations. The scenario is exported to the registry as `nexus_scenario`. A new
        library entry point only: no existing run, KPI or frozen reference run moved.
    - date: 2026-10-27
      commit: null
      tier: 2
      summary: >-
        The nexus battery can run a declared variant of its shared scenario — another start
        week and/or another set of outage durations (`nexus_variant`), owner-requested for one
        5-week outage from week 30 — stored whole beside its own hash; and a stored battery
        now records the root seed it ran on. The shared scenario and every result of it are
        unchanged: no existing run, KPI or frozen reference run moved.

- version: "0.8.0"
  date: 2026-10-04
  commit: null
  tier: 3
  adr: "0003"
  summary: >-
    A product can take time to make: a production lead time per product, fixed or drawn from
    a distribution like a supplier's, so what starts this week is finished stock some weeks
    later. Planned production is offset by the expected lead time and work in progress is
    traced. A product with no production lead time completes in the week it starts, as before.
  technical: >-
    P-P.13 (new): a per-product production pipeline ring — `production_started` is what
    starts at t, `production_output` what completes (t − L); a new world spawn key draws
    each product's lead time (`seeds.product_prodtime_rng`), with the shapes of
    `core/leadtime.py`; the plan reads `production_lead_time_offset` (E[L]). Mapper keys
    `prod_lead_time_*`. Pipeline schema stamp only.
  policies: [P-P.13]
  kpis: [fill_rate, lost_sales_value]
  goldens_moved: []
  comparable: changed-for
  comparability: >-
    Results change only for projects whose products carry a production lead time (L > 0) or
    its shape; L = 0, the default, runs byte-identically (every frozen reference run kept its
    digest).
  refs: [D300, D301, WP 16.4, WP 16.5, ADR 0003]
  amendments:
    - date: 2026-10-20
      commit: null
      tier: 2
      summary: >-
        An inspection run (one replication, full trace) also records each product's
        finished-goods stock and its target week by week (`product.fg_on_hand`,
        `product.fg_target`, summing to `fg_units`) and the fulfillment mode the engine
        resolved (`product.make_to_stock`, 1 = make-to-stock). Output only: no KPI, series or
        frozen reference run moved.

- version: "0.7.0"
  date: 2026-10-03
  commit: null
  tier: 3
  adr: "0003"
  summary: >-
    A supplier lead time can follow a normal, triangular or uniform distribution, chosen per
    supplier × material row with only the parameters that shape needs, as demand is. A
    bounded shape plans on the mean of its bounds. Lognormal and gamma lead times and every
    project with no new shape are unchanged.
  technical: >-
    P-S.6 widened: `LeadTimeDist` gains normal / triangular / uniform; their standard uniforms
    are drawn per (lane, week) from a new world spawn key (`seeds.lane_leadtime_rng`, one
    child stream per lane) before any policy acts, and turned into a lead time by the one
    inverse CDF in `core/leadtime.py`. A bounded link's planning lead time is its bounds'
    mean; P-P.3's King formula reads the shape's own σ/μ. Pipeline schema stamp only.
  policies: [P-S.6]
  kpis: [fill_rate, lost_inbound_units, cost_of_resilience]
  goldens_moved: []
  comparable: changed-for
  comparability: >-
